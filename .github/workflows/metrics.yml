name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Modern Classic Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: aitorgallegocr21
          filename: github-metrics.svg
          template: classic
          
          # Repositorios y autoría para tus colaboraciones
          repositories_affiliations: owner, collaborator
          commits_authoring: aitorgallegocr21, aitorgallegocr21@gmail.com
          
          # Ocultamos la cabecera repetitiva y la base estándar con ceros
          base: ""
          
          # 1. PLUGIN DE LÍNEAS DE CÓDIGO (Líneas añadidas / borradas por ti)
          plugin_lines: yes
          plugin_lines_sections: base
          plugin_lines_history_limit: 3
          plugin_lines_repositories_limit: 10
          
          # 2. PLUGIN DE LENGUAJES (Formato moderno y limpio)
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_colors: github
          
          # 3. Estética moderna: Paleta Tokyo Night con borde sutil
          config_theme: tokyonight
          config_border: yes
          config_padding: 4%, 8%
