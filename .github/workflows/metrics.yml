name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Terminal Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: aitorgallegocr21
          filename: github-metrics.svg
          template: terminal
          
          # Repositorios propios y en los que colaboras
          repositories_affiliations: owner, collaborator
          commits_authoring: aitorgallegocr21, aitorgallegocr21@gmail.com
          
          # 1. Base sin métricas a cero (oculta seguidores y cabecera)
          base: activity
          
          # 2. Líneas añadidas y eliminadas reales
          plugin_lines: yes
          plugin_lines_sections: base
          plugin_lines_history_limit: 3
          plugin_lines_repositories_limit: 10
          
          # 3. Lenguajes en formato compacto de consola
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 7
          plugin_languages_colors: github
