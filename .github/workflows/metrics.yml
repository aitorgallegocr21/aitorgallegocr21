name: Metrics

on:
  # Se ejecuta automáticamente todos los días a medianoche UTC
  schedule:
    - cron: "0 0 * * *"
  # Permite ejecutarlo manualmente desde la pestaña Actions
  workflow_dispatch:
  # Se ejecuta si haces cambios en la rama principal
  push:
    branches: ["main", "master"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: aitorgallegocr21
          template: classic
          
          # Generar archivo SVG limpio para incrustar en el README
          filename: github-metrics.svg
          
          # Opciones de diseño y tema acordes a tu perfil
          config_timezone: Europe/Madrid
          config_theme: github-dark
          config_order: base.header, lines, languages
          
          # Bloques base a mostrar (solo cabecera limpia, ocultando actividad/comunidad que ya tienes)
          base: header
          
          # Ámbito de repositorios: tus repositorios y en los que eres colaborador
          repositories_affiliations: owner, collaborator
          
          # CLAVE: Identifica qué commits son tuyos para auditar SOLO tus líneas añadidas
          commits_authoring: aitorgallegocr21, aitorgallegocr21@gmail.com
          
          # 1. PLUGIN DE LÍNEAS DE CÓDIGO (Líneas añadidas / borradas por ti)
          plugin_lines: yes
          plugin_lines_history_limit: 2
          plugin_lines_repositories_limit: 10
          
          # 2. PLUGIN DE LENGUAJES (Muestra los lenguajes utilizados en tus proyectos y colaboraciones)
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_colors: github
          
          # Desactivar decoraciones pesadas para mantenerlo minimalista y limpio
          config_padding: 0, 8%
