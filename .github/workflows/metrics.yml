name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Unified GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: aitorgallegocr21
          filename: github-metrics.svg
          template: classic
          
          # Solo mostramos la actividad (commits, PRs, etc.), OMITIENDO avatar y followers
          base: activity
          
          # Ámbito: repos propios y donde colaboras
          repositories_affiliations: owner, collaborator
          commits_authoring: aitorgallegocr21, aitorgallegocr21@gmail.com
          
          # 1. PLUGIN DE LÍNEAS DE CÓDIGO
          plugin_lines: yes
          plugin_lines_history_limit: 3
          plugin_lines_repositories_limit: 15
          
          # 2. PLUGIN DE LENGUAJES (Porcentajes limpios)
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_colors: github
          
          # Tema oscuro estilizado y sin márgenes rotos
          config_theme: tokyonight
          config_padding: 4%, 8%
