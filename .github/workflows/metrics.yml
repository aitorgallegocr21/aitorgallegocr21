name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Unified Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: aitorgallegocr21
          filename: github-metrics.svg
          template: classic
          
          # 1. MOSTRAR COMMITS Y ACTIVIDAD (sin el avatar ni seguidores redundantes)
          base: activity, repositories
          base_indepth: yes
          
          # Repositorios propios y colaboraciones
          repositories_affiliations: owner, collaborator
          
          # 2. AUTORÍA DE COMMITS: cubre tu usuario, correo directo y el noreply de GitHub
          commits_authoring: aitorgallegocr21, aitorgallegocr21@gmail.com, aitorgallegocr21@users.noreply.github.com
          
          # 3. LÍNEAS DE CÓDIGO (Auditoría de líneas añadidas / borradas)
          plugin_lines: yes
          plugin_lines_sections: base, history, repositories
          plugin_lines_history_limit: 5
          plugin_lines_repositories_limit: 15
          
          # 4. LENGUAJES (Porcentajes limpios, sin kB)
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_colors: github
          
          # 5. ESTILIZADO TOKYO NIGHT
          config_theme: tokyonight
          config_padding: 4%, 8%
