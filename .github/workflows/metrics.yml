name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: General Metrics & Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: aitorgallegocr21
          filename: github-metrics.svg
          template: classic
          
          # 1. Commits, actividad y repositorios
          base: activity, repositories
          repositories_affiliations: owner, collaborator
          commits_authoring: aitorgallegocr21, aitorgallegocr21@gmail.com, aitorgallegocr21@users.noreply.github.com
          
          # 2. Lenguajes más usados con porcentajes automáticos
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_colors: github
          
          config_padding: 4%, 8%

      - name: Isometric 3D Commit Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: aitorgallegocr21
          filename: isocalendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
